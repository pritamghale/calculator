<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="#" />
    <link rel="stylesheet" href="style.css">
    <title>Calculator</title>
</head>

<body>
    <div style="border: 1px solid black;">
        <div><input type="text" id="display"></div>
        <div class="menupad" style="border: 1px solid black;">
            <div>
                <button>AC</button>
                <button>( )</button>
                <button>%</button>
                <button>/</button>
            </div>
            <div>
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button>x</button>
            </div>
            <div>
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button>-</button>
            </div>
            <div>
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button>+</button>
            </div>
            <div>
                <button>0</button>
                <button>.</button>
                <button>Del</button>
                <button>=</button>
            </div>
        </div>
    </div>
    <script src="script.js" defer></script>
</body>

</html>
